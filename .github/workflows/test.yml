# 責務: スキルが配るインストーラのコア（assets/core）を、system 方式・user 方式の両方で実際に動かして検査する。
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: シェルの検査（構文・shellcheck）
        run: |
          for f in assets/core/installer/*.sh scripts/*.sh tests/*.sh; do sh -n "$f"; done
          shellcheck -S warning assets/core/installer/*.sh assets/app/installer/app.sh scripts/*.sh tests/*.sh

      - name: E2E（user 方式）
        run: sh tests/e2e.sh user

      - name: E2E（system 方式）
        run: sudo sh tests/e2e.sh system

      - name: E2E（常設コマンドをアプリのサブコマンドにする形）
        run: |
          sh tests/e2e.sh user sub
          sudo sh tests/e2e.sh system sub

  e2e-alpine:
    # busybox の sh・coreutils でもコアが動くことを確かめる（system 方式）
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - name: 依存の導入
        run: apk add --no-cache -q git ca-certificates

      - uses: actions/checkout@v7

      - name: E2E（system 方式）
        run: |
          sh tests/e2e.sh system
          sh tests/e2e.sh system sub
